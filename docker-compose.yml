services:
  postgres:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    restart: unless-stopped
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: amazon/aws-cli:latest@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 mb s3://warehouse || aws --endpoint-url http://minio:9000 s3 ls s3://warehouse; do sleep 2; done"

  trino:
    image: trinodb/trino:latest@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    restart: unless-stopped
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["./trino/catalog:/etc/trino/catalog:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  temporal:
    image: temporalio/auto-setup:latest@sha256:9be7b8d98f60d00f4f2ff74731c071a17848d8182bbc8429e314a24c94ea105b
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }

  temporal-ui:
    image: temporalio/ui:latest@sha256:d944f959d0923c35cd991a17a0edbe087770eff843724b181933e0cfdd563ab2
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports: ["8081:8080"]
    depends_on: [temporal]

volumes:
  pgdata:
  miniodata:
